name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast, no services: typecheck + unit tests.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Switch to `npm ci` once package-lock.json is committed.
      - run: npm install
      - run: npm run typecheck
      - run: npm test

  # Real Postgres (with pgvector) and Redis: event-log fencing, RLS, ledger SQL, pgvector, leases, BullMQ end to end.
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NEXUS_ITEST: '1'
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck:integration
      - run: npm run test:integration

  # Real Docker daemon on the runner, default runc runtime.
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXUS_DOCKER_ITEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: docker pull node:22-bookworm-slim
      - run: npm run test:docker

  # Same suite under gVisor (runsc). Experimental: an installation or compatibility problem on the runner
  # must not hide the results of the jobs above, so this one is allowed to fail.
  gvisor:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    env:
      NEXUS_DOCKER_ITEST: '1'
      NEXUS_RUNTIME: runsc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install gVisor (official apt repository)
        run: |
          set -euxo pipefail
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" | sudo tee /etc/apt/sources.list.d/gvisor.list
          sudo apt-get update
          sudo apt-get install -y runsc
          sudo runsc install
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}'
      - run: npm install
      - run: docker pull node:22-bookworm-slim
      - run: docker run --rm --runtime=runsc node:22-bookworm-slim node -e "console.log('hello from gVisor')"
      - run: npm run test:docker

  # The real AWS SDK against the moto EC2 emulator. Allowed to fail until the emulator's behavior has been confirmed stable.
  aws-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    services:
      moto:
        image: motoserver/moto:latest
        ports:
          - 5000:5000
    env:
      NEXUS_AWS_EMULATOR: '1'
      AWS_ENDPOINT_URL: http://localhost:5000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Wait for moto
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/moto-api/ >/dev/null && exit 0
            sleep 2
          done
          echo "moto did not start"; exit 1
      - run: npm run test:aws-emulator

  # A real embedding model, run locally (downloads about 25 MB). Prints the benchmark against the lexical baseline.
  embeddings:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    env:
      NEXUS_EMBED_ITEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm install --no-save @huggingface/transformers@^3
      - run: npm run test:embeddings
